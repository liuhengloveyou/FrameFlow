# FrameFlow 默认配置模板（仓库内版本，可直接使用）。
# 运行方式二选一：
#   1) 复制到当前目录：cp configs/frameflow.yaml ./frameflow.yaml 再启动二进制（本地 frameflow.yaml 受 .gitignore，不提交）
#   2) 不显式 -c 时，程序会依次尝试读取 frameflow.yaml、本文件 configs/frameflow.yaml（见 internal/app/config.go）
#
# 协议（RTMP/RTSP/GB28181/ONVIF）、设备/流、AI 模型与算法均不在此配置：
#   - 协议：UI「系统 → 协议配置」→ frameflow.db / sys_config
#   - 设备与流：cameras / gb28181 表，启动时同步到内存流表（勿手写 streams）
#   - 视觉：模型仓库 + 算法/绑定参数在库中；采样默认值由代码提供

log:
  level: info
  # file:路径 — 追加写入；目录不存在时会自动创建。也可用 stdout / stderr
  output: file:logs/frameflow.log
  time: UNIXMS
  # caller: false   # 默认 true：每条日志带 file:line（相对启动时工作目录）；纯 JSON 采集时可关闭

api:
  listen: ":27788"
  # 开发时可指向前端构建目录，免重新 go build：
  # static_dir: frontend/dist
  # 未配置时优先嵌入 frontend/dist（需先 pnpm build），否则回退旧版 www/

webrtc:
  listen: ":8555"

# 系统级数据库（cameras / gb28181 / sys_config / ai_* 等业务表共用）
# driver: sqlite3 | postgres
database:
  driver: sqlite3
  dsn: "data/frameflow.db"
  # driver: postgres
  # dsn: "postgres://frameflow:frameflow@127.0.0.1:5432/frameflow?sslmode=disable"
